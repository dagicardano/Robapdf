name: RoPDF build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build web app and offline package
        run: npm run build
      - name: Upload built web app
        uses: actions/upload-artifact@v4
        with:
          name: RoPDF-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
