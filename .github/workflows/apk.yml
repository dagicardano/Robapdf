name: Build RoPDF Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ropdf-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify RoPDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check source
        run: npm run lint

      - name: Build offline web application
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.robel.ropdf",
            "appName": "RoPDF",
            "webDir": "dist",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Enable Android camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'''
          if "android.permission.CAMERA" not in s:
              s = s.replace(marker, marker + "\n    " + permissions, 1)
          p.write_text(s)
          PY

      - name: Install native PDF save bridge (Downloads + folder picker)
        run: |
          mkdir -p android/app/src/main/java/com/robel/ropdf
          cat > android/app/src/main/java/com/robel/ropdf/RoPDFSavePlugin.kt <<'KOTLIN'
          package com.robel.ropdf

          import android.app.AlertDialog
          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import com.getcapacitor.ActivityCallback
          import com.getcapacitor.ActivityResult
          import com.getcapacitor.JSObject
          import com.getcapacitor.Plugin
          import com.getcapacitor.PluginCall
          import com.getcapacitor.PluginMethod
          import com.getcapacitor.annotation.CapacitorPlugin

          @CapacitorPlugin(name = "RoPDFSave")
          class RoPDFSavePlugin : Plugin() {
              private var pendingBytes: ByteArray? = null
              private var pendingName: String = "document.pdf"

              @PluginMethod
              fun savePdf(call: PluginCall) {
                  val encoded = call.getString("base64")
                  val requestedName = call.getString("fileName") ?: "document.pdf"
                  if (encoded.isNullOrBlank()) {
                      call.reject("No PDF data was provided")
                      return
                  }
                  try {
                      pendingBytes = Base64.decode(encoded, Base64.DEFAULT)
                      pendingName = requestedName.replace(Regex("[^A-Za-z0-9._-]"), "_")
                          .let { if (it.endsWith(".pdf", true)) it else "$it.pdf" }
                  } catch (error: Exception) {
                      call.reject("Could not decode PDF data", error)
                      return
                  }
                  activity.runOnUiThread {
                      AlertDialog.Builder(activity)
                          .setTitle("Save PDF")
                          .setItems(arrayOf("Save to Downloads", "Choose folder…")) { _, choice ->
                              if (choice == 0) saveToDownloads(call) else chooseFolder(call)
                          }
                          .setNegativeButton("Cancel") { _, _ -> call.reject("Save cancelled") }
                          .show()
                  }
              }

              private fun saveToDownloads(call: PluginCall) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      chooseFolder(call)
                      return
                  }
                  try {
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, pendingName)
                          put(MediaStore.Downloads.MIME_TYPE, "application/pdf")
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          put(MediaStore.Downloads.IS_PENDING, 1)
                      }
                      val resolver = context.contentResolver
                      val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          ?: throw IllegalStateException("Android could not create the Downloads file")
                      resolver.openOutputStream(uri)?.use { it.write(pendingBytes ?: byteArrayOf()) }
                          ?: throw IllegalStateException("Could not write the PDF")
                      val ready = ContentValues().apply { put(MediaStore.Downloads.IS_PENDING, 0) }
                      resolver.update(uri, ready, null, null)
                      finish(call, uri, "Downloads")
                  } catch (error: Exception) {
                      call.reject("Could not save to Downloads: ${error.message}", error)
                  }
              }

              private fun chooseFolder(call: PluginCall) {
                  val intent = Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "application/pdf"
                      putExtra(Intent.EXTRA_TITLE, pendingName)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          putExtra("android.provider.extra.INITIAL_URI",
                              MediaStore.Downloads.EXTERNAL_CONTENT_URI)
                      }
                  }
                  startActivityForResult(call, intent, "savePickerResult")
              }

              @ActivityCallback
              private fun savePickerResult(call: PluginCall, result: ActivityResult) {
                  if (result.resultCode != android.app.Activity.RESULT_OK) {
                      call.reject("Save cancelled")
                      return
                  }
                  val uri: Uri = result.data?.data ?: run {
                      call.reject("No destination was selected")
                      return
                  }
                  try {
                      context.contentResolver.openOutputStream(uri)?.use {
                          it.write(pendingBytes ?: byteArrayOf())
                      } ?: throw IllegalStateException("Could not open the selected destination")
                      finish(call, uri, "Selected folder")
                  } catch (error: Exception) {
                      call.reject("Could not save the PDF: ${error.message}", error)
                  }
              }

              private fun finish(call: PluginCall, uri: Uri, destination: String) {
                  pendingBytes = null
                  val result = JSObject()
                  result.put("uri", uri.toString())
                  result.put("savedTo", destination)
                  call.resolve(result)
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/robel/ropdf/MainActivity.kt")
          s = p.read_text()
          if "RoPDFSavePlugin" not in s:
              s = s.replace("import com.getcapacitor.BridgeActivity", "import com.getcapacitor.BridgeActivity\\nimport com.robel.ropdf.RoPDFSavePlugin")
              s = s.replace("class MainActivity : BridgeActivity()", "class MainActivity : BridgeActivity() {\\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\\n        registerPlugin(RoPDFSavePlugin::class.java)\\n        super.onCreate(savedInstanceState)\\n    }\\n}")
              p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RoPDF APK
        uses: actions/upload-artifact@v4
        with:
          name: RoPDF-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
