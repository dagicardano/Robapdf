name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build web assets and prepare Android
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          printf '{\n  "appId": "com.robel.robapdf",\n  "appName": "Robapdf",\n  "webDir": "dist"\n}\n' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: robapdf-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
