name: Build RoPDF Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ropdf-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify RoPDF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check source
        run: npm run lint

      - name: Build offline web application
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.robel.ropdf",
            "appName": "RoPDF",
            "webDir": "dist",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Enable Android camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'''
          if "android.permission.CAMERA" not in s:
              s = s.replace(marker, marker + "\n    " + permissions, 1)
          p.write_text(s)
          PY

      - name: Install native PDF save bridge (Downloads + folder picker)
        run: |
          mkdir -p android/app/src/main/java/com/robel/ropdf
          cat > android/app/src/main/java/com/robel/ropdf/RoPDFSavePlugin.java <<'JAVA'
          package com.robel.ropdf;

          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.ActivityCallback;
          import com.getcapacitor.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "RoPDFSave")
          public class RoPDFSavePlugin extends Plugin {
              private byte[] pendingBytes;
              private String pendingName = "document.pdf";

              @PluginMethod
              public void savePdf(PluginCall call) {
                  String encoded = call.getString("base64");
                  String name = call.getString("fileName", "document.pdf");
                  if (encoded == null || encoded.isEmpty()) {
                      call.reject("No PDF data was provided");
                      return;
                  }
                  try {
                      pendingBytes = Base64.decode(encoded, Base64.DEFAULT);
                      pendingName = name.replaceAll("[^A-Za-z0-9._-]", "_");
                      if (!pendingName.toLowerCase().endsWith(".pdf")) pendingName += ".pdf";
                  } catch (Exception error) {
                      call.reject("Could not decode PDF data", error);
                      return;
                  }
                  getActivity().runOnUiThread(() -> new AlertDialog.Builder(getActivity())
                      .setTitle("Save PDF")
                      .setItems(new String[]{"Save to Downloads", "Choose folder…"}, (dialog, choice) -> {
                          if (choice == 0) saveToDownloads(call); else chooseFolder(call);
                      })
                      .setNegativeButton("Cancel", (dialog, which) -> call.reject("Save cancelled"))
                      .show());
              }

              private void saveToDownloads(PluginCall call) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      chooseFolder(call);
                      return;
                  }
                  try {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Downloads.DISPLAY_NAME, pendingName);
                      values.put(MediaStore.Downloads.MIME_TYPE, "application/pdf");
                      values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      values.put(MediaStore.Downloads.IS_PENDING, 1);
                      Uri uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) throw new IllegalStateException("Android could not create the Downloads file");
                      try (java.io.OutputStream output = getContext().getContentResolver().openOutputStream(uri)) {
                          if (output == null) throw new IllegalStateException("Could not write the PDF");
                          output.write(pendingBytes);
                      }
                      ContentValues ready = new ContentValues();
                      ready.put(MediaStore.Downloads.IS_PENDING, 0);
                      getContext().getContentResolver().update(uri, ready, null, null);
                      finish(call, uri, "Downloads");
                  } catch (Exception error) {
                      call.reject("Could not save to Downloads: " + error.getMessage(), error);
                  }
              }

              private void chooseFolder(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("application/pdf");
                  intent.putExtra(Intent.EXTRA_TITLE, pendingName);
                  startActivityForResult(call, intent, "savePickerResult");
              }

              @ActivityCallback
              public void savePickerResult(PluginCall call, ActivityResult result) {
                  if (result.getResultCode() != android.app.Activity.RESULT_OK || result.getData() == null) {
                      call.reject("Save cancelled");
                      return;
                  }
                  Uri uri = result.getData().getData();
                  if (uri == null) {
                      call.reject("No destination was selected");
                      return;
                  }
                  try (java.io.OutputStream output = getContext().getContentResolver().openOutputStream(uri)) {
                      if (output == null) throw new IllegalStateException("Could not open selected destination");
                      output.write(pendingBytes);
                      finish(call, uri, "Selected folder");
                  } catch (Exception error) {
                      call.reject("Could not save the PDF: " + error.getMessage(), error);
                  }
              }

              private void finish(PluginCall call, Uri uri, String destination) {
                  pendingBytes = null;
                  JSObject result = new JSObject();
                  result.put("uri", uri.toString());
                  result.put("savedTo", destination);
                  call.resolve(result);
              }
          }
          JAVA
          cat > android/app/src/main/java/com/robel/ropdf/MainActivity.java <<'JAVA'
          package com.robel.ropdf;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RoPDFSavePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RoPDF APK
        uses: actions/upload-artifact@v4
        with:
          name: RoPDF-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
